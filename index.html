<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GraphComp: copy-paste components for node-based canvas interfaces."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23299bed%22/%3E%3C/svg%3E"
    />
    <title>GraphComp Playground</title>
    <script>
      // Animated node heights make React Flow's ResizeObserver re-measure every
      // frame. Browsers report that as a benign "ResizeObserver loop" error.
      // This classic script runs before the Vite client, so it can stop the
      // dev server from reporting the error as a crash.
      window.addEventListener("error", function (event) {
        if (String(event.message).indexOf("ResizeObserver loop") === 0) {
          event.stopImmediatePropagation()
        }
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/playground/main.tsx"></script>
  </body>
</html>
