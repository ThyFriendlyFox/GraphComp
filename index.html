<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a1d" media="(prefers-color-scheme: dark)" />
    <style>
      .js .seo-fallback {
        display: none;
      }
    </style>
    <script>
      // Apply the saved theme before first paint, so the page does not flash.
      // The static fallback content is for crawlers that do not run scripts.
      document.documentElement.classList.add("js")
      try {
        var theme = localStorage.getItem("gc-site-theme")
        if (theme === "light") document.documentElement.classList.remove("dark")
      } catch (error) {}
      // Animated node heights make React Flow's ResizeObserver re-measure every
      // frame. Browsers report that as a benign "ResizeObserver loop" error.
      // This classic script runs before the Vite client, so it can stop the
      // dev server from reporting the error as a crash.
      window.addEventListener("error", function (event) {
        if (String(event.message).indexOf("ResizeObserver loop") === 0) {
          event.stopImmediatePropagation()
        }
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
