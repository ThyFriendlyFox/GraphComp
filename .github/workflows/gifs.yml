name: Record GIFs
on:
  workflow_dispatch:
    inputs:
      clips:
        description: "Clip names, space-separated (empty = all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record
        run: pnpm gifs ${{ inputs.clips }}
      - uses: actions/upload-artifact@v4
        with:
          name: readme-gifs
          path: .github/assets/*.gif
